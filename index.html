<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlugRadar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --accent: #58a6ff;
      --accent-glow: rgba(88,166,255,0.25);
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --text: #e6edf3;
      --muted: #8b949e;
      --header-h: 50px;
      --sidebar-h: 260px;
    }

    html, body {
      height: 100%; width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      overflow: hidden;
    }

    /* ── Layout ── */
    #app { display: flex; flex-direction: column; height: 100dvh; }

    /* ── Header ── */
    #header {
      height: var(--header-h);
      display: flex; align-items: center; gap: 10px;
      padding: 0 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #header h1 { font-size: 1.05rem; font-weight: 700; white-space: nowrap; }
    #header h1 span { color: var(--accent); }
    .badge {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 2px 10px;
      font-size: 0.78rem; color: var(--muted); white-space: nowrap;
    }
    #aircraft-count { color: var(--accent); font-weight: 700; }
    .spacer { flex: 1; }
    #status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
      transition: background 0.3s;
    }
    #status-dot.active  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    #status-dot.error   { background: var(--red); }
    #status-dot.loading { background: var(--yellow); animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

    #btn-refresh {
      background: var(--accent); color: #000; border: none;
      border-radius: 6px; padding: 6px 12px;
      font-size: 0.82rem; font-weight: 700; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
      transition: opacity 0.2s;
    }
    #btn-refresh:hover  { opacity: 0.85; }
    #btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; }

    #radius-select {
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 6px; font-size: 0.8rem; cursor: pointer; flex-shrink: 0;
    }

    /* ── Main ── */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── Map ── */
    #map {
      flex: 1;
      /* explicit fallback height for environments where flex doesn't propagate */
      min-height: 200px;
    }
    /* Override leaflet dark map background */
    .leaflet-container { background: #1a1f29 !important; }

    /* ── Sidebar ── */
    #sidebar {
      width: 300px; flex-shrink: 0;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem; color: var(--muted);
      display: flex; align-items: center; gap: 6px;
      flex-shrink: 0;
    }
    #last-update { margin-left: auto; font-variant-numeric: tabular-nums; }

    /* Aircraft list */
    #aircraft-list { flex: 1; overflow-y: auto; }
    #aircraft-list::-webkit-scrollbar { width: 5px; }
    #aircraft-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .aircraft-item {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 8px; align-items: center;
      transition: background 0.12s;
    }
    .aircraft-item:hover   { background: var(--surface2); }
    .aircraft-item.selected { background: rgba(88,166,255,.1); border-left: 3px solid var(--accent); padding-left: 9px; }
    .aircraft-item.closest  { border-top: 2px solid var(--green); }

    .ac-icon   { font-size: 1.25rem; text-align: center; line-height: 1; }
    .ac-call   { font-weight: 700; font-size: 0.92rem; }
    .ac-sub    { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .ac-dist   { font-size: 0.78rem; font-weight: 700; color: var(--accent); text-align: right; white-space: nowrap; }
    .ac-dist small { display: block; font-size: 0.68rem; color: var(--muted); font-weight: 400; }

    /* Detail panel */
    #detail-panel {
      border-top: 1px solid var(--border);
      padding: 12px;
      background: var(--surface2);
      flex-shrink: 0;
      display: none;
    }
    #detail-panel.visible { display: block; }
    #detail-title {
      font-weight: 700; font-size: 0.95rem;
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    #detail-close {
      margin-left: auto; background: none; border: none;
      color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1;
    }
    #detail-close:hover { color: var(--text); }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .detail-item { background: var(--surface); border-radius: 6px; padding: 7px 9px; }
    .detail-label { font-size: 0.68rem; color: var(--muted); margin-bottom: 2px; }
    .detail-value { font-size: 0.85rem; font-weight: 600; line-height: 1.3; }
    .up   { color: var(--green) !important; }
    .down { color: var(--red)   !important; }

    /* Empty / error state */
    #empty-state {
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 30px 16px; gap: 8px;
      color: var(--muted); font-size: 0.85rem; text-align: center;
    }
    #empty-state.visible { display: flex; }
    #empty-state .icon { font-size: 2.2rem; }

    /* Toast */
    #toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 16px;
      font-size: 0.82rem; z-index: 9999;
      transition: transform 0.3s ease;
      pointer-events: none; white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* User location marker */
    .user-dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); border: 2px solid #fff;
      animation: ring 2s infinite;
    }
    @keyframes ring {
      0%   { box-shadow: 0 0 0 0   rgba(88,166,255,.5); }
      70%  { box-shadow: 0 0 0 12px rgba(88,166,255,0); }
      100% { box-shadow: 0 0 0 0   rgba(88,166,255,0); }
    }

    /* Plane label tooltip */
    .plane-lbl {
      background: rgba(13,17,23,.88);
      border: 1px solid rgba(88,166,255,.35);
      color: #e6edf3; border-radius: 4px;
      padding: 1px 5px; font-size: 0.68rem; font-weight: 700;
      white-space: nowrap; pointer-events: none;
    }

    /* Mobile: stack vertically */
    @media (max-width: 640px) {
      #sidebar {
        width: 100%;
        height: var(--sidebar-h);
        border-left: none;
        border-top: 1px solid var(--border);
      }
      #main { flex-direction: column; }
      #detail-panel { max-height: 180px; overflow-y: auto; }
    }
  </style>
</head>
<body>
<div id="app">

  <div id="header">
    <div id="status-dot"></div>
    <h1>✈ Flug<span>Radar</span></h1>
    <div class="badge"><span id="aircraft-count">0</span> Flugzeuge</div>
    <div class="spacer"></div>
    <select id="radius-select">
      <option value="25">25 km</option>
      <option value="50" selected>50 km</option>
      <option value="100">100 km</option>
      <option value="200">200 km</option>
    </select>
    <button id="btn-refresh">Aktualisieren</button>
  </div>

  <div id="main">
    <div id="map"></div>

    <div id="sidebar">
      <div id="sidebar-header">
        <span>📡 Flugzeuge in der Nähe</span>
        <span id="last-update"></span>
      </div>

      <div id="aircraft-list">
        <div id="empty-state">
          <span class="icon">🛸</span>
          <span id="empty-msg">Standort wird ermittelt…</span>
        </div>
      </div>

      <div id="detail-panel">
        <div id="detail-title">
          <span id="det-icon">✈</span>
          <span id="det-call">–</span>
          <button id="detail-close">✕</button>
        </div>
        <div class="detail-grid" id="det-grid"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ────────────────────────────────────────
//  Config
// ────────────────────────────────────────
const REFRESH_MS  = 30_000;
const KM_TO_NM    = 0.539957;

// ────────────────────────────────────────
//  State
// ────────────────────────────────────────
let map, userMarker;
let userPos        = null;
let aircraftData   = [];
let aircraftMarkers= {};   // hex → { marker }
let selectedHex    = null;
let refreshTimer   = null;
let isLoading      = false;

// ────────────────────────────────────────
//  Map
// ────────────────────────────────────────
function initMap() {
  map = L.map('map', { zoomControl: true });

  // Use OpenStreetMap — universally available, no extra key needed
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> | Flugdaten: <a href="https://adsb.fi">adsb.fi</a> / <a href="https://adsb.lol">adsb.lol</a>',
    maxZoom: 19
  }).addTo(map);

  map.setView([51, 10], 7);
}

// ────────────────────────────────────────
//  Geolocation
// ────────────────────────────────────────
function getLocation() {
  setStatus('loading');
  setEmptyMsg('Standort wird ermittelt…');

  if (!navigator.geolocation) {
    return showError('Geolocation wird von diesem Browser nicht unterstützt.');
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      placeUser();
      map.setView([userPos.lat, userPos.lng], 10);
      fetchAircraft();
      startTimer();
    },
    err => showError('Standort nicht verfügbar: ' + err.message),
    { enableHighAccuracy: true, timeout: 15000 }
  );
}

function placeUser() {
  if (userMarker) map.removeLayer(userMarker);
  userMarker = L.marker([userPos.lat, userPos.lng], {
    icon: L.divIcon({ className: '', html: '<div class="user-dot"></div>', iconSize: [14,14], iconAnchor: [7,7] }),
    zIndexOffset: 1000
  }).addTo(map).bindPopup('<b>Dein Standort</b>');
}

// ────────────────────────────────────────
//  API – tries multiple free sources in order
// ────────────────────────────────────────
const APIS = [
  (lat, lng, nm) => `https://api.adsb.fi/v1/aircraft?lat=${lat}&lng=${lng}&radius=${nm}`,
  (lat, lng, nm) => `https://api.adsb.lol/v2/lat/${lat}/lon/${lng}/dist/${nm}`,
  (lat, lng, nm, km) => {
    const d = km * DEG_PER_KM;
    return `https://opensky-network.org/api/states/all?lamin=${lat-d}&lomin=${lng-d}&lamax=${lat+d}&lomax=${lng+d}`;
  },
];
const DEG_PER_KM = 1 / 111;

async function tryFetch(url) {
  const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function normalizeOpenSky(states) {
  return (states || [])
    .filter(s => s[6] != null && s[5] != null && !s[8])
    .map(s => ({
      hex: s[0], flight: s[1], r: '', t: '',
      lat: s[6], lon: s[5],
      alt_baro: s[7] ? s[7] / 0.3048 : null,  // m → ft
      gs: s[9] ? s[9] * 1.94384 : null,        // m/s → kt
      track: s[10],
      baro_rate: s[11] ? s[11] * 196.85 : null, // m/s → ft/min
      squawk: s[14],
    }));
}

async function fetchAircraft() {
  if (!userPos || isLoading) return;
  isLoading = true;
  setStatus('loading');
  document.getElementById('btn-refresh').disabled = true;

  const radiusKm = +document.getElementById('radius-select').value;
  const radiusNm = Math.max(1, Math.round(radiusKm * KM_TO_NM));
  const { lat, lng } = userPos;

  let lastErr;
  for (let i = 0; i < APIS.length; i++) {
    const url = APIS[i](lat, lng, radiusNm, radiusKm);
    try {
      const json = await tryFetch(url);
      // OpenSky returns { states: [...] }, others return { ac: [...] }
      const raw = json.ac ?? normalizeOpenSky(json.states);
      processAircraft(raw);
      setStatus('active');
      const t = new Date();
      document.getElementById('last-update').textContent =
        `${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`;
      isLoading = false;
      document.getElementById('btn-refresh').disabled = false;
      return;
    } catch (e) {
      console.warn(`API ${i+1} failed:`, e.message);
      lastErr = e;
    }
  }

  console.error('All APIs failed:', lastErr);
  showError('Alle Datenquellen nicht erreichbar – bitte VPN prüfen oder später erneut versuchen.');
  isLoading = false;
  document.getElementById('btn-refresh').disabled = false;
}

// ────────────────────────────────────────
//  Process adsb.lol aircraft array
// ────────────────────────────────────────
function processAircraft(raw) {
  const airborne = raw.filter(a =>
    a.lat != null && a.lon != null && a.alt_baro !== 'ground' && typeof a.alt_baro === 'number'
  );

  aircraftData = airborne.map(a => ({
    hex:      a.hex || '',
    callsign: (a.flight || '').trim() || (a.hex || '').toUpperCase(),
    reg:      a.r   || '',
    type:     a.t   || '',
    lat:      a.lat,
    lng:      a.lon,
    altFt:    a.alt_baro,          // already in feet
    altM:     Math.round(a.alt_baro * 0.3048),
    speedKt:  a.gs   ?? null,
    speedKmh: a.gs   != null ? Math.round(a.gs * 1.852) : null,
    track:    a.track ?? null,
    vsFtMin:  a.baro_rate ?? null,
    squawk:   a.squawk || '',
    dist:     haversine(userPos.lat, userPos.lng, a.lat, a.lon),
  })).sort((a, b) => a.dist - b.dist);

  document.getElementById('aircraft-count').textContent = aircraftData.length;
  renderList();
  updateMarkers();
}

// ────────────────────────────────────────
//  Sidebar list
// ────────────────────────────────────────
function renderList() {
  const list = document.getElementById('aircraft-list');
  [...list.querySelectorAll('.aircraft-item')].forEach(el => el.remove());

  if (aircraftData.length === 0) {
    document.getElementById('empty-state').classList.add('visible');
    setEmptyMsg('Keine Flugzeuge im gewählten Radius.');
    return;
  }
  document.getElementById('empty-state').classList.remove('visible');

  aircraftData.forEach((ac, i) => {
    const item = document.createElement('div');
    item.className = 'aircraft-item'
      + (i === 0            ? ' closest'  : '')
      + (ac.hex === selectedHex ? ' selected' : '');
    item.dataset.hex = ac.hex;

    const altFt  = ac.altFt  != null ? Math.round(ac.altFt).toLocaleString('de') + ' ft' : '–';
    const spdKt  = ac.speedKt != null ? Math.round(ac.speedKt) + ' kt' : '–';
    const vDir   = ac.vsFtMin > 50 ? '↑' : ac.vsFtMin < -50 ? '↓' : '→';
    const sub    = [ac.reg, ac.type].filter(Boolean).join(' · ') || ac.callsign;

    item.innerHTML = `
      <div class="ac-icon">${arrow(ac.track)}</div>
      <div>
        <div class="ac-call">${esc(ac.callsign)}</div>
        <div class="ac-sub">${esc(sub)} &bull; ${altFt} ${vDir} &bull; ${spdKt}</div>
      </div>
      <div class="ac-dist">
        ${ac.dist < 1 ? '<1' : Math.round(ac.dist)} km
        <small>${i === 0 ? '📍 nächstes' : ''}</small>
      </div>`;

    item.addEventListener('click', () => select(ac.hex));
    list.appendChild(item);
  });
}

// ────────────────────────────────────────
//  Map markers
// ────────────────────────────────────────
function updateMarkers() {
  const seen = new Set(aircraftData.map(a => a.hex));

  aircraftData.forEach((ac, i) => {
    const isSel = ac.hex === selectedHex;
    const isTop = i === 0;

    if (aircraftMarkers[ac.hex]) {
      aircraftMarkers[ac.hex].marker.setLatLng([ac.lat, ac.lng]);
      aircraftMarkers[ac.hex].marker.setIcon(planeIcon(ac.track, isSel, isTop));
    } else {
      const m = L.marker([ac.lat, ac.lng], {
        icon: planeIcon(ac.track, isSel, isTop),
        title: ac.callsign,
        zIndexOffset: isTop ? 500 : 0
      }).addTo(map);
      m.on('click', () => select(ac.hex));
      m.bindTooltip(`<span class="plane-lbl">${esc(ac.callsign)}</span>`,
        { permanent: false, direction: 'top', offset: [0, -10] });
      aircraftMarkers[ac.hex] = { marker: m };
    }
  });

  // Remove stale
  for (const hex of Object.keys(aircraftMarkers)) {
    if (!seen.has(hex)) {
      map.removeLayer(aircraftMarkers[hex].marker);
      delete aircraftMarkers[hex];
    }
  }
}

// ────────────────────────────────────────
//  Select
// ────────────────────────────────────────
function select(hex) {
  selectedHex = hex;
  const ac = aircraftData.find(a => a.hex === hex);
  if (!ac) return;

  document.querySelectorAll('.aircraft-item').forEach(el =>
    el.classList.toggle('selected', el.dataset.hex === hex)
  );
  for (const [h, { marker }] of Object.entries(aircraftMarkers)) {
    const d = aircraftData.find(a => a.hex === h);
    if (d) marker.setIcon(planeIcon(d.track, h === hex, d === aircraftData[0]));
  }

  const el = document.querySelector(`.aircraft-item[data-hex="${hex}"]`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  map.flyTo([ac.lat, ac.lng], Math.max(map.getZoom(), 10), { duration: 1 });
  showDetail(ac);
}

function showDetail(ac) {
  document.getElementById('detail-panel').classList.add('visible');
  document.getElementById('det-call').textContent = ac.callsign;

  const alt    = ac.altFt   != null ? Math.round(ac.altFt).toLocaleString('de') + ' ft' : '–';
  const altM   = ac.altM    != null ? ac.altM.toLocaleString('de') + ' m' : '–';
  const spd    = ac.speedKt != null ? Math.round(ac.speedKt) + ' kt' : '–';
  const spdKmh = ac.speedKmh != null ? ac.speedKmh + ' km/h' : '–';
  const trk    = ac.track   != null ? `${Math.round(ac.track)}° (${compass(ac.track)})` : '–';
  const vs     = ac.vsFtMin != null ? (ac.vsFtMin > 0 ? '+' : '') + Math.round(ac.vsFtMin) + ' ft/min' : '–';
  const vsClass= ac.vsFtMin >  50 ? 'up' : ac.vsFtMin < -50 ? 'down' : '';

  document.getElementById('det-grid').innerHTML = `
    <div class="detail-item"><div class="detail-label">Rufzeichen</div><div class="detail-value">${esc(ac.callsign)}</div></div>
    <div class="detail-item"><div class="detail-label">Entfernung</div><div class="detail-value">${Math.round(ac.dist)} km</div></div>
    <div class="detail-item"><div class="detail-label">Höhe</div><div class="detail-value">${alt}<br><small style="color:var(--muted);font-size:.72rem">${altM}</small></div></div>
    <div class="detail-item"><div class="detail-label">Geschwindigkeit</div><div class="detail-value">${spd}<br><small style="color:var(--muted);font-size:.72rem">${spdKmh}</small></div></div>
    <div class="detail-item"><div class="detail-label">Kurs</div><div class="detail-value">${trk}</div></div>
    <div class="detail-item"><div class="detail-label">Steigrate</div><div class="detail-value ${vsClass}">${vs}</div></div>
    ${ac.reg  ? `<div class="detail-item"><div class="detail-label">Kennzeichen</div><div class="detail-value">${esc(ac.reg)}</div></div>` : ''}
    ${ac.type ? `<div class="detail-item"><div class="detail-label">Flugzeugtyp</div><div class="detail-value">${esc(ac.type)}</div></div>` : ''}
    <div class="detail-item" style="grid-column:span 2">
      <div class="detail-label">ICAO24 / Links</div>
      <div class="detail-value" style="font-family:monospace;font-size:.78rem">
        ${ac.hex.toUpperCase()}
        &nbsp;·&nbsp;
        <a href="https://globe.adsb.lol/?icao=${ac.hex}" target="_blank" style="color:var(--accent)">adsb.lol ↗</a>
        &nbsp;·&nbsp;
        <a href="https://www.flightradar24.com/${encodeURIComponent(ac.callsign)}" target="_blank" style="color:var(--accent)">FR24 ↗</a>
      </div>
    </div>`;
}

// ────────────────────────────────────────
//  Helpers
// ────────────────────────────────────────
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (lat2 - lat1) * r, dLng = (lng2 - lng1) * r;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*r) * Math.cos(lat2*r) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function compass(deg) {
  const d = ['N','NNO','NO','ONO','O','OSO','SO','SSO','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return d[Math.round(deg / 22.5) % 16];
}

function arrow(track) {
  if (track == null) return '✈';
  return ['⬆','↗','➡','↘','⬇','↙','⬅','↖'][Math.round(track / 45) % 8];
}

function planeIcon(track, selected, closest) {
  const deg   = track ?? 0;
  const color = selected ? '#58a6ff' : closest ? '#3fb950' : '#d0d7de';
  const size  = selected ? 28 : 22;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 100 100"
    style="transform:rotate(${deg}deg);display:block;filter:drop-shadow(0 0 3px ${color}99)">
    <path d="M50 5 L60 40 L95 45 L60 60 L65 90 L50 80 L35 90 L40 60 L5 45 L40 40 Z"
      fill="${color}" stroke="#000a" stroke-width="3"/>
  </svg>`;
  return L.divIcon({ className: '', html: svg, iconSize: [size,size], iconAnchor: [size/2,size/2] });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pad(n) { return String(n).padStart(2,'0'); }
function setStatus(s) { document.getElementById('status-dot').className = s; }
function setEmptyMsg(m) { document.getElementById('empty-msg').textContent = m; }

function showError(msg) {
  setStatus('error');
  document.getElementById('empty-state').classList.add('visible');
  setEmptyMsg(msg);
  showToast('⚠ ' + msg);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4500);
}

function startTimer() {
  clearInterval(refreshTimer);
  refreshTimer = setInterval(fetchAircraft, REFRESH_MS);
}

// ────────────────────────────────────────
//  Events
// ────────────────────────────────────────
document.getElementById('btn-refresh').addEventListener('click', () => {
  userPos ? fetchAircraft() : getLocation();
});
document.getElementById('radius-select').addEventListener('change', () => {
  if (userPos) fetchAircraft();
});
document.getElementById('detail-close').addEventListener('click', () => {
  document.getElementById('detail-panel').classList.remove('visible');
  selectedHex = null;
  document.querySelectorAll('.aircraft-item').forEach(el => el.classList.remove('selected'));
});

// ────────────────────────────────────────
//  Boot
// ────────────────────────────────────────
initMap();
getLocation();
</script>
</body>
</html>
